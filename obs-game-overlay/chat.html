<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="themes/fonts.css">
<link rel="stylesheet" href="themes/chat.css">
<script src="version.js"></script>
<script src="themes/games.js"></script>
<script src="themes/fursona.js"></script>
<script src="themes/library.js"></script>
<script src="themes/fusion.js"></script>
<script src="themes/chat.js"></script>
<script src="themes/client.js"></script>
<style>
  /* Źródło czatu do OBS.  ?mode=bubbles (domyślnie) – dymki wyskakują i znikają;  ?mode=panel – czat na stałe.
     ?pos=br|bl|tr|tl (dymki), ?life=12 (sekundy), ?width=520 */
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
  #chat { position: absolute; box-sizing: border-box; }
  .m-bubbles #chat { right: 40px; bottom: 40px; width: var(--w, 560px); max-height: 70vh; }
  .m-bubbles.p-bl #chat { right: auto; left: 40px; } .m-bubbles.p-bl .cmsg { align-self: flex-start; transform-origin: left bottom; }
  .m-bubbles.p-tr #chat { bottom: auto; top: 40px; } .m-bubbles.p-tl #chat { bottom: auto; top: 40px; right: auto; left: 40px; }
  .m-panel #chat { inset: 0; padding: 16px; }
</style>
</head>
<body>
<div id="chat"></div>
<script>
(() => {
  const C = window.VMClient;
  const mode = C.param('mode') === 'panel' ? 'panel' : 'bubbles';
  const base = `m-${mode} p-${C.param('pos') || 'br'}`;
  if (C.param('width')) document.documentElement.style.setProperty('--w', parseInt(C.param('width'), 10) + 'px');
  const chat = window.OverlayChat.mount(document.getElementById('chat'), { mode, life: parseFloat(C.param('life')) || 12 });
  C.applyTheme(base);
  C.events(ev => { if (ev.type === 'chat') { C.applyTheme(base); chat.add(ev); } }, { onSettings: () => C.applyTheme(base) });
})();
</script>
</body>
</html>
