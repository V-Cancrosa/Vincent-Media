<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Game Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="themes/fonts.css">
<link rel="stylesheet" href="themes/games.css">
<script src="version.js"></script>
<script src="themes/games.js"></script>
<link rel="stylesheet" href="themes/fursona.css">
<script src="themes/fursona.js"></script>
<link rel="stylesheet" href="themes/library.css">
<script src="themes/library.js"></script>
<link rel="stylesheet" href="themes/fusion.css">
<script src="themes/fusion.js"></script>
<script src="themes/fit.js"></script>
<script src="themes/voices.js"></script>
<script src="themes/voices-games.js"></script>
<script src="themes/voices-en.js"></script>
<script src="themes/voices-trans.js"></script>
<script src="themes/i18n.js"></script>
<script src="themes/wordfilter.js"></script>
<script src="themes/socials.js"></script>
<link rel="stylesheet" href="themes/base.css">
<link rel="stylesheet" href="themes/chat.css">
<script src="themes/chat.js"></script>
<script src="themes/client.js"></script>
<style>
  /* pasek czatu na ekranie gry (w każdej scenie z tą nakładką) */
  #ticker { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; }
  .tk-top #ticker { top: 0; bottom: auto; }
  .tk-top #ticker.chat-ticker { border-top: 0; border-bottom: 2px solid var(--accent); transform: translateY(-100%); }
  .tk-top #ticker.chat-ticker.on { transform: none; }
  /* pionowo: kolumna przy krawędzi, nad grą; karta po tej samej stronie – kolumna kończy się wyżej */
  #ticker.vchat { top: 110px; bottom: 110px; left: auto; right: 30px; width: 440px; display: flex; }
  #ticker.vchat.vs-left { left: 30px; right: auto; }
  .pos-bl #ticker.vchat.vs-left, .pos-br #ticker.vchat.vs-right { bottom: 300px; }
  .pos-tl #ticker.vchat.vs-left, .pos-tr #ticker.vchat.vs-right { top: 300px; }
</style>
</head>
<body class="theme-neon pos-bl">
<div id="stage">
  <div id="wrap">
    <canvas id="fx"></canvas>
    <div id="backdrop" aria-hidden="true"></div>
    <div id="card">
      <div id="icon"><span id="mono"></span></div>
      <div id="text">
        <div id="label"><span class="dot"></span><span id="labelText">Teraz gram</span></div>
        <div id="name"></div>
        <div id="meta"><span id="sub"></span><span id="timer"></span></div>
      </div>
    </div>
    <div id="emblem" aria-hidden="true"></div>
    <div id="pop" aria-hidden="true"></div>
  </div>
</div>
<div id="ticker"></div>

<script>
(() => {
  const KEY = 'obsGameOverlay.v1';
  const DETECTED_KEY = 'obsGameOverlay.detected';
  const SIM_KEY = 'obsGameOverlay.sim'; // tylko strona demo: udawany wykrywacz

  const DEFAULTS = {
    game: '', subtitle: '', cover: '', since: 0,
    label: 'Teraz gram', theme: 'neon', position: 'bl',
    accent: '', accent2: '', mode: 'auto', discordId: '', ignore: '',
    timer: true, icon: true, showLabel: true, visible: true, scale: 1, margin: 40,
    local: true, localUrl: 'http://localhost:7777',
    gameThemes: true,   // motyw gry włącza się sam, gdy gra ma własny motyw
    motion: 'full'      // 'full' | 'reduced' – celowo NIE czytamy prefers-reduced-motion
  };

  // ---- ustawienia z URL (działa bez panelu) ----
  const p = new URLSearchParams(location.search);
  const bool = v => !(v === '0' || v === 'false' || v === 'no');
  const fromUrl = {};
  const map = {
    game: 'game', sub: 'subtitle', cover: 'cover', label: 'label', theme: 'theme', pos: 'position',
    accent: 'accent', accent2: 'accent2', mode: 'mode', discord: 'discordId', ignore: 'ignore', localUrl: 'localUrl', motion: 'motion'
  };
  for (const [k, v] of Object.entries(map)) if (p.has(k)) fromUrl[v] = p.get(k);
  if (p.has('gameThemes')) fromUrl.gameThemes = bool(p.get('gameThemes'));
  if (p.has('gameMode')) fromUrl.gameMode = p.get('gameMode');
  if (p.has('local')) fromUrl.local = bool(p.get('local'));
  if (p.has('timer')) fromUrl.timer = bool(p.get('timer'));
  if (p.has('icon')) fromUrl.icon = bool(p.get('icon'));
  if (p.has('showLabel')) fromUrl.showLabel = bool(p.get('showLabel'));
  if (p.has('scale')) fromUrl.scale = parseFloat(p.get('scale')) || 1;
  if (p.has('margin')) fromUrl.margin = parseInt(p.get('margin'), 10) || 0;
  if (fromUrl.accent && /^[0-9a-f]{3,8}$/i.test(fromUrl.accent)) fromUrl.accent = '#' + fromUrl.accent;
  if (fromUrl.accent2 && /^[0-9a-f]{3,8}$/i.test(fromUrl.accent2)) fromUrl.accent2 = '#' + fromUrl.accent2;
  const usePanel = !(p.get('panel') === '0');

  const readStore = () => {
    if (!usePanel) return null;
    try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; }
  };

  const normalize = st => {
    if (st.mode === 'detect') st.mode = 'discord'; // 'discord' = tylko wykryta automatycznie
    if (!st.since) st.since = Date.now();
    return st;
  };
  let settings = normalize({ ...DEFAULTS, ...fromUrl, ...(readStore() || {}) });

  // ---- DOM ----
  const $ = id => document.getElementById(id);
  const card = $('card'), icon = $('icon'), mono = $('mono'), nameEl = $('name'),
        subEl = $('sub'), timerEl = $('timer'), labelText = $('labelText');

  // ---- kolory z nazwy gry ----
  function hash(str) {
    let h = 2166136261;
    for (const c of str) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function autoAccents(name) {
    const h = hash(name.toLowerCase()) % 360;
    return [`hsl(${h} 90% 60%)`, `hsl(${(h + 45) % 360} 95% 60%)`];
  }
  function monogram(name) {
    const words = name.replace(/[^\p{L}\p{N}\s:]/gu, '').split(/[\s:]+/).filter(Boolean);
    if (!words.length) return '?';
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  // ---- Discord (Lanyard) ----
  // Discord działa tylko, gdy jest włączony w panelu (Ustawienia → Funkcje) albo podany w adresie (?discord=…)
  const dcId = () => (settings.features && settings.features.discord === false && !fromUrl.discordId) ? '' : settings.discordId;
  let discordGame = null, discordStatus = '';
  let ws = null, hb = null, wsId = '', retry = null;

  function assetUrl(a) {
    const img = a.assets && a.assets.large_image;
    if (img) {
      if (img.startsWith('mp:')) return 'https://media.discordapp.net/' + img.slice(3);
      if (/^\d+$/.test(img) && a.application_id) return `https://cdn.discordapp.com/app-assets/${a.application_id}/${img}.png`;
    }
    if (a.application_id) return `https://dcdn.dstn.to/app-icons/${a.application_id}?size=256`;
    return '';
  }

  function onPresence(d) {
    const acts = (d && d.activities) || [];
    const a = acts.find(x => x.type === 0);
    discordGame = a ? {
      name: a.name,
      sub: [a.details, a.state].filter(Boolean).join(' · '),
      start: a.timestamps && a.timestamps.start ? a.timestamps.start : 0,
      images: assetUrl(a) ? [assetUrl(a)] : [],
      source: 'discord'
    } : null;
    discordStatus = (d && d.discord_status) || 'connected';
    publish();
    render();
  }

  function disconnect() {
    clearInterval(hb); clearTimeout(retry);
    if (ws) { ws.onclose = null; try { ws.close(); } catch {} }
    ws = null; wsId = ''; discordStatus = '';
  }

  function connect(id) {
    disconnect();
    if (!id || settings.mode === 'manual') { discordGame = null; publish(); return; }
    wsId = id;
    ws = new WebSocket('wss://api.lanyard.rest/socket');
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.op === 1) {
        hb = setInterval(() => ws && ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), m.d.heartbeat_interval);
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: id } }));
      } else if (m.op === 0 && (m.t === 'INIT_STATE' || m.t === 'PRESENCE_UPDATE')) {
        onPresence(m.d);
      }
    };
    ws.onclose = () => {
      clearInterval(hb);
      retry = setTimeout(() => connect(id), 5000);
    };
  }

  // ---- lokalny wykrywacz (detector/detector.ps1) ----
  let localGame = null, localOnline = false, localRecent = [], localTimer = null;
  const normImages = v => (Array.isArray(v) ? v : v ? [v] : []).filter(x => typeof x === 'string' && x);

  async function pollLocal() {
    clearTimeout(localTimer);
    // tryb ręczny (gra wybrana z listy) też odpytuje wykrywacz: stan, grafiki, synchronizacja ustawień – karta i tak pokazuje wybraną grę
    if (!settings.local) {
      if (localGame || localOnline) { localGame = null; localOnline = false; render(); }
      publish();
      localTimer = setTimeout(pollLocal, 3000);
      return;
    }
    let delay = 2000;
    try {
      let j, sim = null;
      try { sim = JSON.parse(localStorage.getItem(SIM_KEY)); } catch {}
      if (sim && sim.active) {
        j = { online: true, game: sim.game, recent: sim.recent || [] };
      } else {
        if (sim && sim.active === false) throw new Error('sim off');
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 1500);
        const r = await fetch(window.vmHub(settings.localUrl) + '/game', { signal: ctl.signal, cache: 'no-store' });
        clearTimeout(t);
        j = await r.json();
        if (window.vmCheckVersion) window.vmCheckVersion(j.appVersion);
        if (usePanel && j.settingsRev != null && j.settingsRev !== hubRev) syncFromHub(j.settingsRev);
      }
      localOnline = true;
      localRecent = Array.isArray(j.recent) ? j.recent : j.recent ? [j.recent] : [];
      const g = j.game;
      const next = g && g.name ? {
        name: String(g.name), sub: '', start: +g.start || 0, images: normImages(g.images), kind: String(g.kind || ''),
        source: 'local', exe: g.exe || '', via: g.via || '', steam: g.steam || ''
      } : null;
      if (JSON.stringify(next) !== JSON.stringify(localGame)) { localGame = next; render(); }
    } catch {
      if (localOnline || localGame) { localOnline = false; localGame = null; render(); }
      delay = 10000; // wykrywacz nie działa – pytaj rzadziej
    }
    publish();
    localTimer = setTimeout(pollLocal, delay);
  }

  // ustawienia z wykrywacza (np. zmienione z telefonu) – działa też przy zamkniętym doku
  let hubRev = null;
  async function syncFromHub(rev) {
    try {
      const r = await fetch(window.vmHub(settings.localUrl) + '/settings', { cache: 'no-store' });
      const j = await r.json();
      hubRev = j.rev;
      if (!j.settings) return;
      const next = JSON.stringify(j.settings);
      if (localStorage.getItem(KEY) !== next) { localStorage.setItem(KEY, next); reload(); }
    } catch {}
  }

  // status dla panelu
  function publish() {
    try {
      localStorage.setItem(DETECTED_KEY, JSON.stringify({
        at: Date.now(),
        local: { enabled: !!settings.local, online: localOnline, game: localGame, recent: localRecent, url: settings.localUrl },
        discord: { enabled: !!dcId(), status: discordStatus, game: discordGame }
      }));
    } catch {}
  }

  // ---- co pokazać ----
  function ignored(name) {
    return settings.ignore.split(',').map(s => s.trim().toLowerCase()).filter(Boolean).includes(name.toLowerCase());
  }
  function current() {
    const manual = settings.game.trim()
      ? { name: settings.game.trim(), sub: settings.subtitle, start: settings.since, images: settings.cover ? [settings.cover] : settings.gameSteam && settings.local !== false ? [window.vmHub(settings.localUrl) + '/art?id=' + encodeURIComponent(settings.gameSteam) + '&k=cover'] : [], source: 'manual', steam: settings.gameSteam || '' }
      : null;
    // kolejność: lokalny wykrywacz > Discord
    const det = [localGame, discordGame].find(x => x && !ignored(x.name));
    let d = det ? { ...det } : null;
    if (d) {
      // ręczny podtytuł / okładka wygrywają, jeśli nazwa się zgadza
      const same = manual && manual.name.toLowerCase() === d.name.toLowerCase();
      if (same && manual.images.length) d.images = manual.images;
      if (same && manual.sub) d.sub = manual.sub;
      if (!d.sub && settings.subtitle && settings.mode === 'discord') d.sub = settings.subtitle;
    }
    if (settings.mode === 'manual') return manual;
    if (settings.mode === 'discord') return d;
    return d || manual; // auto
  }

  // ---- render ----
  let shownKey = null, swapTimer = null, emblemFor = null;
  const wrap = $('wrap'), emblemEl = $('emblem'), backEl = $('backdrop');
  const GT = window.OverlayGameThemes || { find: () => null, byId: () => null, FX: { attach() {}, set() {} }, texture: () => '' };
  GT.FX.attach($('fx'));

  // styl + gra: postać / motyw bazowy łączy się z motywem gry (themes/fusion.js)
  let fxFor = null;
  function applyStyle(g) {
    const th = GT.resolve ? GT.resolve(settings, g && g.name, null, g && g.kind) : { cls: settings.theme || 'neon', def: null, game: null };
    const gameDef = th.game || (th.def && th.def.group !== 'fursona' ? th.def : null);
    const making = (g && g.kind === 'make') || (gameDef && gameDef.kind === 'make');
    const def = th.def;
    const reduced = settings.motion === 'reduced';
    // postać: po stronie rogu, w którym stoi karta, i patrzy do środka ekranu (themes/fursona.js → side, face)
    const pd = th.persona || (def && def.group === 'fursona' ? def : null);
    const pos = String(settings.position || 'bl'), side = pos[1] === 'l' ? 'l' : pos[1] === 'r' ? 'r' : (pd && pd.side) || 'l';
    const flip = pd && pd.face && pd.face !== (side === 'l' ? 'right' : 'left');
    const popSrc = pd && pd.pop && !th.persona ? pd.pop : '';
    document.body.className = `theme-${th.cls} pos-${settings.position} side-${side}` + (flip ? ' face-flip' : '') + (popSrc ? ' has-pop' : '') + (GT.bodyClasses ? GT.bodyClasses(th) : '') +
      (reduced ? ' reduced-motion' : '') + (settings.icon ? '' : ' no-icon') + (settings.showLabel ? '' : ' no-label');
    const key = th.cls + '|' + (th.game ? th.game.id : '') + '|' + (th.persona ? th.persona.id : '') + '|' + th.mode + '|' + (th.variant || '');
    if (emblemFor !== key) {
      emblemFor = key;
      // alerty, ekrany i układy używają tego samego stylu, gry i trybu fuzji
      try { localStorage.setItem('obsGameOverlay.activeTheme', JSON.stringify(GT.publishable ? GT.publishable(th) : { cls: th.cls, game: th.game ? th.game.id : '' })); } catch {}
      emblemEl.innerHTML = def ? def.emblem || '' : '';
      backEl.innerHTML = def ? def.back || '' : '';
    }
    const popEl = $('pop');
    if (popEl.dataset.src !== popSrc) { popEl.dataset.src = popSrc; popEl.innerHTML = popSrc ? `<img src="${popSrc}" alt="">` : ''; }
    // logo gry (Steam – z pamięci Steama na tym komputerze przez wykrywacz, inaczej z CDN Steama) na naszywce
    th.logo = g && g.steam && settings.local !== false && settings.gameLogo !== false ? window.vmHub(settings.localUrl) + '/art?id=' + encodeURIComponent(g.steam) + '&k=logo' : '';
    if (GT.applyFusion) GT.applyFusion(wrap, th);
    if (window.OverlayChat) window.OverlayChat.setSkin(document.getElementById('ticker'), th, settings.chatSkin !== false);
    const fxKey = key + reduced;
    if (fxKey !== fxFor) { fxFor = fxKey; GT.FX.set(!reduced ? (GT.fusionFx ? GT.fusionFx(th) : def && def.fx) : null); }
    document.documentElement.style.setProperty('--tex', def ? GT.texture(def) : '');
    let [a1, a2] = autoAccents(g ? g.name : 'game');
    if (GT.fusionAccent) [a1, a2] = GT.fusionAccent(th, [a1, a2]);
    th.game = def;
    const root = document.documentElement.style;
    root.setProperty('--accent', settings.accent || a1);
    setTimeout(() => GT.markContrast && GT.markContrast(), 0);
    root.setProperty('--accent2', settings.accent2 || a2);
    root.setProperty('--scale', settings.scale);
    root.setProperty('--margin', settings.margin + 'px');
    // motyw postaci ma własny napis, dopóki w panelu zostaje domyślny „Teraz gram”
    const lab = th.persona || th.game;   // napis postaci także wtedy, gdy bazą jest gra
    labelText.textContent = lab && lab.label && settings.label === DEFAULTS.label ? lab.label : settings.label;
    // angielski stream: domyślny napis i napisy motywów po angielsku (własny napis z panelu zostaje bez zmian)
    if (window.VMi18n && settings.label === DEFAULTS.label) labelText.textContent = VMi18n.lang() === 'en' && labelText.textContent === DEFAULTS.label ? VMi18n.t('nowPlaying') : VMi18n.label(labelText.textContent);
    // Blender, Krita itp.: nie „gram”, tylko „tworzę” (także gdy postać ma własny napis z „gram”)
    if (making && settings.label === DEFAULTS.label && /gram|teraz gram|playing/i.test(labelText.textContent)) labelText.textContent = window.VMi18n ? VMi18n.label(gameDef && gameDef.label ? gameDef.label : 'TERAZ TWORZĘ') : (gameDef && gameDef.label ? gameDef.label : 'Teraz tworzę');
  }

  // długa nazwa gry: mniejsza czcionka, a w ostateczności dwie linijki (bez ucinania „…”)
  function fitText() {
    if (!window.VMFit) return;
    requestAnimationFrame(() => { VMFit.text(nameEl, { min: 0.55, lines: 2, container: wrap }); VMFit.text(subEl, { min: 0.7, lines: 2, container: wrap }); });
  }
  if (document.fonts) document.fonts.ready.then(fitText);
  setInterval(fitText, 3000);   // zmiana motywu = inna czcionka i szerokość

  function fill(g) {
    nameEl.textContent = g.name;
    nameEl.dataset.text = g.name;
    subEl.textContent = g.sub || '';
    card.classList.toggle('long', g.name.length > 22);
    card.classList.toggle('xlong', g.name.length > 34);
    card.dataset.start = g.start || 0;
    fitText();
    mono.textContent = monogram(g.name);
    const imgs = g.images || [];
    const sig = imgs.join('|');
    if (icon.dataset.sig !== sig) {
      icon.dataset.sig = sig;
      const old = icon.querySelector('img');
      if (old) old.remove();
      icon.classList.remove('wide');
      mono.style.display = '';
      // próbuj obrazków po kolei, aż któryś się wczyta; inaczej zostaje monogram
      const tryImg = i => {
        if (i >= imgs.length || icon.dataset.sig !== sig) return;
        const img = new Image();
        img.alt = '';
        img.onload = () => {
          if (icon.dataset.sig !== sig) return;
          icon.classList.toggle('wide', img.naturalWidth / img.naturalHeight > 1.4);
          icon.appendChild(img);
          mono.style.display = 'none';
        };
        img.onerror = () => tryImg(i + 1);
        img.src = imgs[i];
      };
      tryImg(0);
    }
    tick();
  }

  // styl zmieniamy razem z treścią – stara gra znika w swoim motywie, nowa wjeżdża w swoim
  const show = g => { applyStyle(g); fill(g); };
  function render() {
    const g = settings.visible ? current() : null;
    const key = g ? `${g.name}|${(g.images || [])[0] || ''}` : null;
    clearTimeout(swapTimer);
    if (!g) { wrap.classList.remove('show'); shownKey = null; return; }
    if (key === shownKey) { show(g); wrap.classList.add('show'); return; }
    if (shownKey && wrap.classList.contains('show')) {
      wrap.classList.remove('show');
      swapTimer = setTimeout(() => { show(g); shownKey = key; requestAnimationFrame(() => wrap.classList.add('show')); }, 480);
    } else {
      show(g); shownKey = key;
      requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('show')));
    }
  }

  function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    const pad = n => String(n).padStart(2, '0');
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  }
  function tick() {
    const start = +card.dataset.start;
    timerEl.textContent = settings.timer && start ? fmt(Date.now() - start) : '';
  }
  setInterval(tick, 1000);

  // ---- synchronizacja z panelem ----
  // ---- pasek czatu: kafelki jadą od prawej; karta odsuwa się, gdy pasek jest widoczny ----
  let tickerChat = null, tickKey = null, obsScene = '';
  const lay = () => (window.OverlayChat && window.OverlayChat.layoutOf ? window.OverlayChat.layoutOf(settings) : { dir: 'h', side: 'bottom' });
  function setGap(on) {
    const r = document.documentElement.style, L = lay(), top = L.dir === 'h' && L.side === 'top';
    r.setProperty('--tb', on && L.dir === 'h' && !top ? '62px' : '0px'); r.setProperty('--tt', on && top ? '62px' : '0px');
  }
  // czat na scenach z grą: poziomo (pasek u góry / u dołu) albo pionowo (kolumna z lewej / prawej, wiadomości znikają po chwili)
  function mountTicker() {
    const L = lay();
    const ownChat = obsScene && window.OverlayChat && window.OverlayChat.OWN_CHAT_SCENE.test(obsScene);
    const want = window.OverlayChat && settings.overlayTicker !== false && p.get('ticker') !== '0' && L.dir !== 'off' && !ownChat;
    const key = (want ? 1 : 0) + '|' + L.dir + L.side + '|' + (window.VMi18n ? VMi18n.lang() : '');
    document.body.classList.toggle('tk-top', L.dir === 'h' && L.side === 'top');
    if (key === tickKey) return; tickKey = key;
    const box = document.getElementById('ticker'); box.className = ''; box.textContent = ''; box.removeAttribute('data-skin'); setGap(false);
    if (!want) { tickerChat = null; return; }
    if (L.dir === 'h') tickerChat = window.OverlayChat.mount(box, { mode: 'ticker', onVisible: setGap });
    else { box.classList.add('vchat', 'vs-' + L.side); tickerChat = window.OverlayChat.mount(box, { mode: 'panel', fade: true, life: 25, max: 8 }); }
    applyStyle(current());
  }
  if (window.VMClient) window.VMClient.events(ev => { if (ev && ev.type === 'chat' && tickerChat) tickerChat.add(ev); });
  try { new BroadcastChannel('obsGameOverlay').addEventListener('message', e => { const m = e.data; if (m && m.type === 'scene' && m.name !== obsScene) { obsScene = m.name; mountTicker(); } }); } catch {}

  function reload() {
    const prevId = dcId(), prevMode = settings.mode;
    const prevLocal = settings.local + settings.localUrl;
    settings = normalize({ ...DEFAULTS, ...fromUrl, ...(readStore() || {}) });
    mountTicker();
    if (settings.local + settings.localUrl !== prevLocal || settings.mode !== prevMode) pollLocal();
    if (dcId() !== prevId || (settings.mode === 'manual') !== (prevMode === 'manual')) connect(dcId());
    render();
  }
  window.addEventListener('storage', e => { if (e.key === KEY) reload(); if (e.key === SIM_KEY) pollLocal(); });
  try {
    const bc = new BroadcastChannel('obsGameOverlay');
    bc.onmessage = e => {
      const d = e.data;
      if (d && typeof d === 'object') {
        return;
      }
      d === 'sim' ? pollLocal() : reload();
    };
  } catch {}

  connect(dcId());
  pollLocal();
  render();
  mountTicker();
})();
</script>
</body>
</html>
